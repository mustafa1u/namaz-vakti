<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Namaz Vakti Desktop</title>
    <style>
      :root {
        --bg: #f3f1eb;
        --panel: #ffffff;
        --ink: #1e1e1e;
        --accent: #315f72;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: radial-gradient(circle at 10% 10%, #f8f5e9, var(--bg));
        color: var(--ink);
      }
      .shell {
        max-width: 980px;
        margin: 2rem auto;
        padding: 1.5rem;
        background: var(--panel);
        border: 1px solid #d5d5d5;
      }
      .row {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: 190px 1fr auto;
        margin-bottom: 0.75rem;
      }
      .time-control {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .time-control input {
        width: 64px;
        text-align: center;
      }
      .tiny {
        padding: 0.25rem 0.45rem;
        line-height: 1;
        min-width: 28px;
      }
      .ampm-label {
        min-width: 44px;
        font-weight: 600;
      }
      .time-group {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      .time-group input {
        width: 64px;
        text-align: center;
      }
      .time-group .group-label {
        min-width: 68px;
        font-weight: 600;
      }
      label {
        font-weight: 600;
      }
      input, select, textarea, button {
        font-size: 14px;
        padding: 0.5rem 0.625rem;
      }
      textarea {
        resize: vertical;
        min-height: 2.75rem;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
      }
      pre {
        background: #fafafa;
        border: 1px solid #ddd;
        padding: 0.75rem;
        min-height: 220px;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Iqamah Schedule Generator</h1>

      <div class="row">
        <label for="tsvFolder">TSV Folder</label>
        <input id="tsvFolder" type="text" />
        <button id="pickTsv" type="button">Browse</button>
      </div>

      <div class="row">
        <label for="outputFolder">Output Folder</label>
        <input id="outputFolder" type="text" />
        <button id="pickOutput" type="button">Browse</button>
      </div>

      <div class="row">
        <label for="month">Month</label>
        <select id="month"></select>
        <button id="refreshMonths" type="button">Refresh</button>
      </div>

      <div class="row">
        <label for="locale">Locale</label>
        <select id="locale">
          <option value="en">English</option>
          <option value="tr">Turkish</option>
        </select>
        <span></span>
      </div>

      <div class="row">
        <label for="timeFormat">Time Format</label>
        <select id="timeFormat">
          <option value="ampm">AM/PM</option>
          <option value="24h">24h</option>
        </select>
        <span></span>
      </div>

      <div class="row">
        <label for="baseGroupSize">Base Group Size</label>
        <select id="baseGroupSize">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
        </select>
        <span></span>
      </div>

      <div class="row">
        <label for="ramazanHesabi">Ramazan hesabı</label>
        <input id="ramazanHesabi" type="checkbox" />
        <span></span>
      </div>

      <div class="row">
        <label for="fajrLatestLimitEnabled">Fajr no later than</label>
        <div class="time-control">
          <input id="fajrLatestLimitEnabled" type="checkbox" />
          <button id="fajrHourDec" class="tiny" type="button">-</button>
          <input id="fajrHour" type="text" inputmode="numeric" />
          <button id="fajrHourInc" class="tiny" type="button">+</button>
          <span>:</span>
          <button id="fajrMinuteDec" class="tiny" type="button">-</button>
          <input id="fajrMinute" type="text" inputmode="numeric" />
          <button id="fajrMinuteInc" class="tiny" type="button">+</button>
          <span id="fajrAmPm" class="ampm-label">AM</span>
        </div>
        <span></span>
      </div>

      <div class="row">
        <label for="zhuhrEarliestLimitEnabled">Zhuhr no earlier than</label>
        <div class="time-control">
          <input id="zhuhrEarliestLimitEnabled" type="checkbox" />
          <select id="zhuhrLimitMode">
            <option value="single">Single limit</option>
            <option value="std-dst">Standard/daylight</option>
          </select>
        </div>
        <span></span>
      </div>

      <div class="row">
        <label for="zhuhrSingleHour">Zhuhr single limit</label>
        <div id="zhuhrSingleGroup" class="time-group">
          <span class="group-label">Single</span>
          <button id="zhuhrSingleHourDec" class="tiny" type="button">-</button>
          <input id="zhuhrSingleHour" type="text" inputmode="numeric" />
          <button id="zhuhrSingleHourInc" class="tiny" type="button">+</button>
          <span>:</span>
          <button id="zhuhrSingleMinuteDec" class="tiny" type="button">-</button>
          <input id="zhuhrSingleMinute" type="text" inputmode="numeric" />
          <button id="zhuhrSingleMinuteInc" class="tiny" type="button">+</button>
          <span id="zhuhrSingleAmPm" class="ampm-label">PM</span>
        </div>
        <span></span>
      </div>

      <div class="row">
        <label for="zhuhrStdHour">Zhuhr standard/daylight limits</label>
        <div id="zhuhrDualGroup" class="time-control">
          <div class="time-group">
            <span class="group-label">Standard</span>
            <button id="zhuhrStdHourDec" class="tiny" type="button">-</button>
            <input id="zhuhrStdHour" type="text" inputmode="numeric" />
            <button id="zhuhrStdHourInc" class="tiny" type="button">+</button>
            <span>:</span>
            <button id="zhuhrStdMinuteDec" class="tiny" type="button">-</button>
            <input id="zhuhrStdMinute" type="text" inputmode="numeric" />
            <button id="zhuhrStdMinuteInc" class="tiny" type="button">+</button>
            <span id="zhuhrStdAmPm" class="ampm-label">PM</span>
          </div>
          <div class="time-group">
            <span class="group-label">Daylight</span>
            <button id="zhuhrDstHourDec" class="tiny" type="button">-</button>
            <input id="zhuhrDstHour" type="text" inputmode="numeric" />
            <button id="zhuhrDstHourInc" class="tiny" type="button">+</button>
            <span>:</span>
            <button id="zhuhrDstMinuteDec" class="tiny" type="button">-</button>
            <input id="zhuhrDstMinute" type="text" inputmode="numeric" />
            <button id="zhuhrDstMinuteInc" class="tiny" type="button">+</button>
            <span id="zhuhrDstAmPm" class="ampm-label">PM</span>
          </div>
        </div>
        <span></span>
      </div>

      <div class="row">
        <label for="announcementMessage">Announcement</label>
        <textarea id="announcementMessage" rows="2" placeholder="Message shown above and below the table"></textarea>
        <span></span>
      </div>

      <div class="row">
        <label></label>
        <button id="preview" type="button">Preview</button>
        <button id="generate" type="button">Generate XLSX + PNG</button>
      </div>

      <pre id="log"></pre>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
