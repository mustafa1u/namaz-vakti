<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' http://localhost:*;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self' data:;
        connect-src 'self' http://localhost:* ws://localhost:*;
        object-src 'none';
        base-uri 'self';
        frame-ancestors 'none';
      "
    />
    <title data-i18n="app.windowTitle">Namaz Vakti Desktop</title>
    <style>
      :root {
        --bg: #f3f1eb;
        --panel: #ffffff;
        --ink: #1e1e1e;
        --accent: #315f72;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: radial-gradient(circle at 10% 10%, #f8f5e9, var(--bg));
        color: var(--ink);
      }
      .shell {
        max-width: 980px;
        margin: 2rem auto;
        padding: 1.5rem;
        background: var(--panel);
        border: 1px solid #d5d5d5;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }
      .topbar h1 {
        margin: 0;
      }
      .language-control {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .row {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: 190px 1fr auto;
        margin-bottom: 0.75rem;
      }
      .row-inline .field-inline {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .field-stack {
        display: grid;
        gap: 0.5rem;
      }
      .mosque-modal-grid {
        display: grid;
        gap: 0.9rem;
      }
      .mosque-modal-section {
        border: 1px solid #d9dfe3;
        padding: 0.75rem;
      }
      .mosque-modal-section h3 {
        margin: 0 0 0.55rem;
        font-size: 14px;
      }
      .mosque-modal-row {
        display: grid;
        gap: 0.55rem;
        margin-bottom: 0.55rem;
      }
      .mosque-modal-inline {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .mosque-add-details > summary {
        cursor: pointer;
        font-weight: 600;
        margin-bottom: 0.55rem;
      }
      .mosque-add-body {
        margin-top: 0.55rem;
      }
      .mosque-modal-inline .spacer {
        flex: 1;
      }
      .mosque-modal-list {
        width: 100%;
      }
      .mosque-modal-message {
        min-height: 1.25rem;
        margin: 0.25rem 0 0;
      }
      .mosque-modal-message[data-variant="error"] {
        color: #b42318;
      }
      .mosque-modal-message[data-variant="ok"] {
        color: #166534;
      }
      .advanced-inline {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .advanced-actions {
        display: flex;
        justify-content: flex-start;
        margin-bottom: 0.75rem;
      }
      .compact-select {
        width: 110px;
      }
      .compact-select-month {
        width: 150px;
      }
      .compact-select-locale {
        width: 120px;
      }
      .compact-select-base {
        width: 70px;
      }
      .compact-select-location {
        width: 170px;
      }
      #stateSelect.compact-select-location {
        width: 136px;
      }
      #citySelect.compact-select-location {
        width: 204px;
      }
      details.advanced {
        border: 1px solid #d5d5d5;
        padding: 0.75rem;
        margin: 1rem 0;
      }
      details.advanced > summary {
        cursor: pointer;
        font-weight: 600;
      }
      .advanced-content {
        margin-top: 0.75rem;
      }
      .time-control {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .checkbox-slot {
        width: 16px;
        flex: 0 0 16px;
      }
      .control-indent {
        width: 46px;
        flex: 0 0 46px;
      }
      .time-control input {
        width: 64px;
        text-align: center;
      }
      .tiny {
        padding: 0.25rem 0.45rem;
        line-height: 1;
        min-width: 28px;
      }
      .ampm-label {
        min-width: 44px;
        font-weight: 600;
      }
      .time-group {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      .time-group input {
        width: 64px;
        text-align: center;
      }
      .time-group .group-label {
        min-width: 68px;
        font-weight: 600;
      }
      .limit-rows {
        display: grid;
        gap: 0.75rem;
      }
      .limit-row-time {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .limit-mode {
        min-width: 130px;
      }
      label {
        font-weight: 600;
      }
      input, select, textarea, button {
        font-size: 14px;
        padding: 0.5rem 0.625rem;
      }
      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
        padding: 0;
      }
      textarea {
        resize: vertical;
        min-height: 2.75rem;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
        transition: transform 60ms ease, filter 120ms ease, box-shadow 120ms ease;
      }
      button:hover:not(:disabled) {
        filter: brightness(0.95);
      }
      button:active:not(:disabled) {
        transform: translateY(1px) scale(0.99);
        filter: brightness(0.88);
      }
      button:focus-visible {
        outline: 2px solid #183947;
        outline-offset: 2px;
        box-shadow: 0 0 0 2px rgba(24, 57, 71, 0.25);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .generate-btn {
        width: 140px;
      }
      .generate-pane {
        display: inline-block;
        background: #e9eef1;
        border: 1px solid #c8d1d7;
        padding: 0.75rem;
      }
      .generate-pane h2 {
        margin: 0 0 0.6rem;
        font-size: 16px;
      }
      .generate-actions {
        display: flex;
        gap: 0.5rem;
      }
      .bottom-actions {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1rem;
      }
      .status {
        min-height: 1.5rem;
        margin: 0.25rem 0 0.75rem;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(12, 20, 24, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 20;
      }
      .modal-backdrop[hidden] {
        display: none !important;
      }
      .modal-panel {
        width: min(920px, 100%);
        max-height: calc(100vh - 2rem);
        overflow: auto;
        background: #ffffff;
        border: 1px solid #bcc8ce;
        padding: 1rem;
      }
      .modal-panel h2 {
        margin: 0 0 0.85rem;
        font-size: 18px;
      }
      .customize-prayers {
        display: grid;
        gap: 0.65rem;
      }
      .customize-prayer {
        border: 1px solid #d9dfe3;
        padding: 0.65rem;
      }
      .customize-prayer-title {
        margin: 0 0 0.55rem;
        font-size: 14px;
      }
      .customize-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }
      .customize-field {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .customize-field input[type="text"] {
        width: 68px;
        text-align: center;
      }
      .customize-field select {
        min-width: 90px;
      }
      .modal-actions {
        margin-top: 0.95rem;
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="topbar">
        <h1 data-i18n="app.heading">Iqamah Schedule Generator</h1>
        <div class="language-control">
          <span data-i18n="labels.uiLanguageShort">Language</span>
          <button id="switchUiLanguage" type="button">Türkçe</button>
        </div>
      </div>

      <div class="row">
        <label for="outputFolder" data-i18n="labels.outputFolder">Output Folder</label>
        <input id="outputFolder" type="text" />
        <button id="pickOutput" type="button" data-i18n="buttons.browse">Browse</button>
      </div>

      <div class="row row-inline">
        <label for="countrySelect" data-i18n="labels.location">Location</label>
        <div class="field-inline">
          <label for="countrySelect" data-i18n="labels.country">Country</label>
          <select id="countrySelect" class="compact-select-location"></select>
          <label for="stateSelect" data-i18n="labels.stateProvince">State/Province</label>
          <select id="stateSelect" class="compact-select-location"></select>
          <label for="citySelect" data-i18n="labels.cityTown">City/Town</label>
          <select id="citySelect" class="compact-select-location"></select>
        </div>
        <span></span>
      </div>

      <div class="row row-inline">
        <label for="month" data-i18n="labels.month">Month</label>
        <div class="field-inline">
          <label for="year" data-i18n="labels.year">Year</label>
          <select id="year" class="compact-select"></select>
          <label for="month" data-i18n="labels.month">Month</label>
          <select id="month" class="compact-select-month"></select>
          <button id="refreshMonths" type="button" data-i18n="buttons.refresh">Refresh</button>
          <label for="timeFormat" data-i18n="labels.timeFormat">Time Format</label>
          <select id="timeFormat" class="compact-select">
            <option value="ampm" data-i18n="options.timeFormat.ampm">AM/PM</option>
            <option value="24h" data-i18n="options.timeFormat.h24">24h</option>
          </select>
        </div>
        <span></span>
      </div>

      <div class="row">
        <label for="masjidName" data-i18n="labels.masjidName">Name of Masjid</label>
        <div class="field-stack">
          <input id="masjidName" type="text" data-i18n-placeholder="placeholders.masjidName" placeholder="Masjid name shown in header" />
        </div>
        <button id="loadMosque" type="button" data-i18n="buttons.loadMosque">Load Mosque</button>
      </div>

      <div class="row">
        <label for="masjidAddress" data-i18n="labels.masjidAddress">Address</label>
        <input id="masjidAddress" type="text" data-i18n-placeholder="placeholders.masjidAddress" placeholder="Masjid address shown in header" />
        <span></span>
      </div>

      <div class="row">
        <label for="announcementMessage" data-i18n="labels.announcementMessage">Announcement</label>
        <textarea id="announcementMessage" rows="2" data-i18n-placeholder="placeholders.announcementMessage" placeholder="Message shown above the table"></textarea>
        <span></span>
      </div>

      <details class="advanced" id="advancedSettings">
        <summary data-i18n="buttons.advanced">Advanced...</summary>
        <div class="advanced-content">
          <div class="advanced-actions">
            <button id="openCustomize" type="button" data-i18n="buttons.customize">Customize</button>
          </div>

          <div class="row">
            <label for="locale" data-i18n="labels.outputLocale">Output Language (Generated Content)</label>
            <div class="advanced-inline">
              <select id="locale" class="compact-select-locale">
                <option value="en" data-i18n="options.outputLocale.en">English</option>
                <option value="tr" data-i18n="options.outputLocale.tr">Turkish</option>
              </select>
              <label for="baseGroupSize" data-i18n="labels.baseGroupSize">Base Group Size</label>
              <select id="baseGroupSize" class="compact-select-base">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="15">15</option>
              </select>
            </div>
            <span></span>
          </div>

          <div class="row">
            <label for="ramazanHesabi" data-i18n="labels.ramazanHesabi">Ramazan hesabi</label>
            <div class="time-control">
              <input id="ramazanHesabi" type="checkbox" />
            </div>
            <span></span>
          </div>
          <div id="advancedLimitRows" class="limit-rows"></div>
        </div>
      </details>

      <p class="status" id="statusMessage" aria-live="polite"></p>

      <div class="bottom-actions">
        <div class="generate-pane">
          <h2 data-i18n="labels.generatePane">Generate</h2>
          <div class="generate-actions">
            <button id="generatePng" class="generate-btn" type="button">PNG</button>
            <button id="generateXlsx" class="generate-btn" type="button">Excel (.xlsx)</button>
          </div>
        </div>
        <button id="resetDefaults" type="button" data-i18n="buttons.resetDefaults">Reset to defaults</button>
      </div>
    </main>

    <div id="mosqueModal" class="modal-backdrop" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="mosqueModalTitle">
        <h2 id="mosqueModalTitle" data-i18n="mosqueModal.title">Cami yükle</h2>
        <div class="mosque-modal-grid">
          <section class="mosque-modal-section">
            <h3 data-i18n="mosqueModal.availableTitle">Available Mosques</h3>
            <div class="mosque-modal-row">
              <select id="mosqueListSelect" class="mosque-modal-list"></select>
            </div>
            <div class="mosque-modal-inline">
              <button id="loadSelectedMosque" type="button" data-i18n="mosqueModal.buttons.load">Load</button>
              <span class="spacer"></span>
              <button id="deleteSelectedMosque" type="button" data-i18n="mosqueModal.buttons.delete">Delete Mosque</button>
            </div>
            <p id="mosqueModalMessage" class="mosque-modal-message" aria-live="polite"></p>
          </section>

          <details id="mosqueAddPane" class="mosque-modal-section mosque-add-details">
            <summary data-i18n="mosqueModal.addTitle">Add Mosque</summary>
            <div class="mosque-add-body">
            <div class="mosque-modal-row">
              <label for="mosqueModalCountry" data-i18n="labels.country">Country</label>
              <select id="mosqueModalCountry"></select>
            </div>
            <div class="mosque-modal-row">
              <label for="mosqueModalState" data-i18n="labels.stateProvince">State/Province</label>
              <select id="mosqueModalState"></select>
            </div>
            <div class="mosque-modal-row">
              <label for="mosqueModalCity" data-i18n="labels.cityTown">City/Town</label>
              <select id="mosqueModalCity"></select>
            </div>
            <div class="mosque-modal-row">
              <label for="mosqueModalName" data-i18n="labels.masjidName">Name of Masjid</label>
              <input id="mosqueModalName" type="text" />
            </div>
            <div class="mosque-modal-row">
              <label for="mosqueModalAddress" data-i18n="labels.masjidAddress">Address</label>
              <input id="mosqueModalAddress" type="text" />
            </div>
            <div class="mosque-modal-inline">
              <button id="addMosque" type="button" data-i18n="mosqueModal.buttons.add">Add</button>
            </div>
            </div>
          </details>
        </div>
        <div class="modal-actions">
          <button id="closeMosqueModal" type="button" data-i18n="buttons.cancel">Cancel</button>
        </div>
      </div>
    </div>

    <div id="customizeModal" class="modal-backdrop" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="customizeTitle">
        <h2 id="customizeTitle" data-i18n="labels.customizeTitle">Customize</h2>
        <div id="customizePrayers" class="customize-prayers"></div>
        <div class="modal-actions">
          <button id="cancelCustomize" type="button" data-i18n="buttons.cancel">Cancel</button>
          <button id="saveCustomize" type="button" data-i18n="buttons.save">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
