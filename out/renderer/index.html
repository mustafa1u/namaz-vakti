<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.windowTitle">Namaz Vakti Desktop</title>
    <style>
      :root {
        --bg: #f3f1eb;
        --panel: #ffffff;
        --ink: #1e1e1e;
        --accent: #315f72;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: radial-gradient(circle at 10% 10%, #f8f5e9, var(--bg));
        color: var(--ink);
      }
      .shell {
        max-width: 980px;
        margin: 2rem auto;
        padding: 1.5rem;
        background: var(--panel);
        border: 1px solid #d5d5d5;
      }
      .row {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: 190px 1fr auto;
        margin-bottom: 0.75rem;
      }
      details.advanced {
        border: 1px solid #d5d5d5;
        padding: 0.75rem;
        margin: 1rem 0;
      }
      details.advanced > summary {
        cursor: pointer;
        font-weight: 600;
      }
      .advanced-content {
        margin-top: 0.75rem;
      }
      .time-control {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .time-control input {
        width: 64px;
        text-align: center;
      }
      .tiny {
        padding: 0.25rem 0.45rem;
        line-height: 1;
        min-width: 28px;
      }
      .ampm-label {
        min-width: 44px;
        font-weight: 600;
      }
      .time-group {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      .time-group input {
        width: 64px;
        text-align: center;
      }
      .time-group .group-label {
        min-width: 68px;
        font-weight: 600;
      }
      label {
        font-weight: 600;
      }
      input, select, textarea, button {
        font-size: 14px;
        padding: 0.5rem 0.625rem;
      }
      textarea {
        resize: vertical;
        min-height: 2.75rem;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
      }
      .status {
        min-height: 1.5rem;
        margin: 0.25rem 0 0.75rem;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-0eEgMJFd.js"></script>
  </head>
  <body>
    <main class="shell">
      <h1 data-i18n="app.heading">Iqamah Schedule Generator</h1>

      <div class="row">
        <label for="switchUiLanguage" data-i18n="labels.uiLanguage">Application Language</label>
        <span id="uiLanguageValue">English</span>
        <button id="switchUiLanguage" type="button">Türkçe</button>
      </div>

      <div class="row">
        <label for="outputFolder" data-i18n="labels.outputFolder">Output Folder</label>
        <input id="outputFolder" type="text" />
        <button id="pickOutput" type="button" data-i18n="buttons.browse">Browse</button>
      </div>

      <div class="row">
        <label for="month" data-i18n="labels.month">Month</label>
        <select id="month"></select>
        <button id="refreshMonths" type="button" data-i18n="buttons.refresh">Refresh</button>
      </div>

      <div class="row">
        <label for="timeFormat" data-i18n="labels.timeFormat">Time Format</label>
        <select id="timeFormat">
          <option value="ampm" data-i18n="options.timeFormat.ampm">AM/PM</option>
          <option value="24h" data-i18n="options.timeFormat.h24">24h</option>
        </select>
        <span></span>
      </div>

      <div class="row">
        <label for="announcementMessage" data-i18n="labels.announcementMessage">Announcement</label>
        <textarea id="announcementMessage" rows="2" data-i18n-placeholder="placeholders.announcementMessage" placeholder="Message shown above and below the table"></textarea>
        <span></span>
      </div>

      <details class="advanced" id="advancedSettings">
        <summary data-i18n="buttons.advanced">Advanced...</summary>
        <div class="advanced-content">
          <div class="row">
            <label for="tsvFolder" data-i18n="labels.tsvFolder">TSV Folder</label>
            <input id="tsvFolder" type="text" />
            <button id="pickTsv" type="button" data-i18n="buttons.browse">Browse</button>
          </div>

          <div class="row">
            <label for="locale" data-i18n="labels.outputLocale">Output Language (Generated Content)</label>
            <select id="locale">
              <option value="en" data-i18n="options.outputLocale.en">English</option>
              <option value="tr" data-i18n="options.outputLocale.tr">Turkish</option>
            </select>
            <span></span>
          </div>

          <div class="row">
            <label for="baseGroupSize" data-i18n="labels.baseGroupSize">Base Group Size</label>
            <select id="baseGroupSize">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="15">15</option>
            </select>
            <span></span>
          </div>

          <div class="row">
            <label for="ramazanHesabi" data-i18n="labels.ramazanHesabi">Ramazan hesabi</label>
            <input id="ramazanHesabi" type="checkbox" />
            <span></span>
          </div>

          <div class="row">
            <label for="fajrLatestLimitEnabled" data-i18n="labels.fajrLatestLimitEnabled">Fajr no later than</label>
            <div class="time-control">
              <input id="fajrLatestLimitEnabled" type="checkbox" />
              <button id="fajrHourDec" class="tiny" type="button">-</button>
              <input id="fajrHour" type="text" inputmode="numeric" />
              <button id="fajrHourInc" class="tiny" type="button">+</button>
              <span>:</span>
              <button id="fajrMinuteDec" class="tiny" type="button">-</button>
              <input id="fajrMinute" type="text" inputmode="numeric" />
              <button id="fajrMinuteInc" class="tiny" type="button">+</button>
              <span id="fajrAmPm" class="ampm-label">AM</span>
            </div>
            <span></span>
          </div>

          <div class="row">
            <label for="zhuhrEarliestLimitEnabled" data-i18n="labels.zhuhrEarliestLimitEnabled">Zhuhr no earlier than</label>
            <div class="time-control">
              <input id="zhuhrEarliestLimitEnabled" type="checkbox" />
              <select id="zhuhrLimitMode">
                <option value="single" data-i18n="options.zhuhrLimitMode.single">Single limit</option>
                <option value="std-dst" data-i18n="options.zhuhrLimitMode.stdDst">Standard/daylight</option>
              </select>
            </div>
            <span></span>
          </div>

          <div class="row">
            <label for="zhuhrSingleHour" data-i18n="labels.zhuhrSingleLimit">Zhuhr single limit</label>
            <div id="zhuhrSingleGroup" class="time-group">
              <span class="group-label" data-i18n="options.zhuhrGroup.single">Single</span>
              <button id="zhuhrSingleHourDec" class="tiny" type="button">-</button>
              <input id="zhuhrSingleHour" type="text" inputmode="numeric" />
              <button id="zhuhrSingleHourInc" class="tiny" type="button">+</button>
              <span>:</span>
              <button id="zhuhrSingleMinuteDec" class="tiny" type="button">-</button>
              <input id="zhuhrSingleMinute" type="text" inputmode="numeric" />
              <button id="zhuhrSingleMinuteInc" class="tiny" type="button">+</button>
              <span id="zhuhrSingleAmPm" class="ampm-label">PM</span>
            </div>
            <span></span>
          </div>

          <div class="row">
            <label for="zhuhrStdHour" data-i18n="labels.zhuhrStdDstLimits">Zhuhr standard/daylight limits</label>
            <div id="zhuhrDualGroup" class="time-control">
              <div class="time-group">
                <span class="group-label" data-i18n="options.zhuhrGroup.standard">Standard</span>
                <button id="zhuhrStdHourDec" class="tiny" type="button">-</button>
                <input id="zhuhrStdHour" type="text" inputmode="numeric" />
                <button id="zhuhrStdHourInc" class="tiny" type="button">+</button>
                <span>:</span>
                <button id="zhuhrStdMinuteDec" class="tiny" type="button">-</button>
                <input id="zhuhrStdMinute" type="text" inputmode="numeric" />
                <button id="zhuhrStdMinuteInc" class="tiny" type="button">+</button>
                <span id="zhuhrStdAmPm" class="ampm-label">PM</span>
              </div>
              <div class="time-group">
                <span class="group-label" data-i18n="options.zhuhrGroup.daylight">Daylight</span>
                <button id="zhuhrDstHourDec" class="tiny" type="button">-</button>
                <input id="zhuhrDstHour" type="text" inputmode="numeric" />
                <button id="zhuhrDstHourInc" class="tiny" type="button">+</button>
                <span>:</span>
                <button id="zhuhrDstMinuteDec" class="tiny" type="button">-</button>
                <input id="zhuhrDstMinute" type="text" inputmode="numeric" />
                <button id="zhuhrDstMinuteInc" class="tiny" type="button">+</button>
                <span id="zhuhrDstAmPm" class="ampm-label">PM</span>
              </div>
            </div>
            <span></span>
          </div>
        </div>
      </details>

      <p class="status" id="statusMessage" aria-live="polite"></p>

      <div class="row">
        <label></label>
        <button id="generatePng" type="button" data-i18n="buttons.generatePng">Generate PNG</button>
        <button id="generateXlsx" type="button" data-i18n="buttons.generateXlsx">Generate XLSX</button>
      </div>
    </main>

  </body>
</html>
